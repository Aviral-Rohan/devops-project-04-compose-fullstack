services:
  proxy:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - edge

  frontend:
    build: ./frontend
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - edge

  api:
    build: ./api
    environment:
      - MONGO_URL=mongodb://brewcart:brewcart123@db:27017/?authSource=admin
    depends_on:
      - db
    networks:
      - edge
      - backend

  db:
    image: mongo:8.3
    environment:
      - MONGO_INITDB_ROOT_USERNAME=brewcart
      - MONGO_INITDB_ROOT_PASSWORD=brewcart123
    volumes:
      - mongo-data:/data/db
    networks:
      - backend

networks:
  edge:
  backend:
    internal: true

volumes:
  mongo-data: