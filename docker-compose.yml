services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

  api:
    build: ./api
    ports:
      - "5050:8000"
    environment:
      - MONGO_URL=mongodb://brewcart:brewcart123@db:27017/?authSource=admin
    depends_on:
      - db

  db:
    image: mongo:8.3
    environment:
      - MONGO_INITDB_ROOT_USERNAME=brewcart
      - MONGO_INITDB_ROOT_PASSWORD=brewcart123
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
