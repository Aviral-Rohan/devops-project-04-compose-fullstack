services:
  proxy:
    image: nginx:1.28-alpine
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - edge

  frontend:
    build: ./frontend
    environment:
      - API_URL=http://api:8000
    healthcheck:
      interval: 10s
      start_period: 10s
      start_interval: 2s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge

  api:
    build: ./api
    environment:
      - MONGO_URL=mongodb://${MONGO_USER:?set MONGO_USER in .env}:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@db:27017/?authSource=admin
      - MONGO_DB=${MONGO_DB:-brewcart}
    healthcheck:
      interval: 10s
      start_period: 10s
      start_interval: 2s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - backend

  db:
    image: mongo:8.3
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:?set MONGO_USER in .env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

networks:
  edge:
  backend:
    internal: true

volumes:
  mongo-data: